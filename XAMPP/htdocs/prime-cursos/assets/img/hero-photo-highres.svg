<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="3840" height="2160" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Fondo colorido de cursos">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="33%" stop-color="#f7b731"/>
      <stop offset="66%" stop-color="#6bc1ff"/>
      <stop offset="100%" stop-color="#8e44ad"/>
    </linearGradient>
    <radialGradient id="g2" cx="30%" cy="20%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="b"/>
      <feComposite in="SourceGraphic" in2="b" operator="over"/>
    </filter>
  </defs>

  <!-- Base gradient -->
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- Large soft shapes -->
  <g opacity="0.85" filter="url(#blur)">
    <ellipse cx="850" cy="600" rx="700" ry="480" fill="#ffd166" opacity="0.7"/>
    <ellipse cx="2600" cy="800" rx="900" ry="650" fill="#7bdff6" opacity="0.6"/>
    <ellipse cx="1800" cy="1400" rx="1100" ry="500" fill="#c084fc" opacity="0.5"/>
  </g>

  <!-- Decorative wave lines -->
  <g fill="none" stroke-opacity="0.12" stroke-width="28">
    <path stroke="#ffffff" d="M0 400 C800 100 1200 700 1920 600 C2640 500 3200 900 3840 700"/>
    <path stroke="#000000" d="M0 1200 C700 1500 1300 900 1920 1100 C2510 1300 3100 900 3840 1200"/>
  </g>

  <!-- Stylized course cards (illustrative foreground) -->
  <g transform="translate(420,420) scale(1.1)" opacity="0.95">
    <rect x="0" y="0" width="900" height="560" rx="28" ry="28" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.07)"/>
    <rect x="960" y="40" width="760" height="420" rx="24" ry="24" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.06)"/>
    <g transform="translate(40,36)">
      <rect x="0" y="0" width="360" height="220" rx="14" fill="#ffffff" opacity="0.06"/>
      <rect x="0" y="248" width="360" height="120" rx="12" fill="#ffffff" opacity="0.03"/>
    </g>
  </g>

  <!-- Light overlay to increase contrast for text -->
  <rect width="100%" height="100%" fill="url(#g2)"/>

  <!-- Subtle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.06"/>

  <!-- Accessibility: hidden title for screen readers is in aria-label on svg element -->
</svg>
