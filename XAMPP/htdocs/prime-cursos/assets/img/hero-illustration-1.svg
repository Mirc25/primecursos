<?xml version="1.0" encoding="UTF-8"?>
<!-- Stylized mockup: laptop with course cards - warm, semi-realistic SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="screenGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f0ff"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#071427" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- background card -->
  <rect x="36" y="28" rx="14" ry="14" width="648" height="384" fill="#071427" opacity="0.9"/>

  <!-- laptop base -->
  <g transform="translate(80,60)">
    <rect x="0" y="0" rx="14" ry="14" width="560" height="320" fill="url(#screenGrad)" filter="url(#softShadow)"/>

    <!-- left column of course cards (with thumbnail mockups) -->
    <g transform="translate(28,26)">
      <rect x="0" y="0" width="220" height="120" rx="10" ry="10" fill="url(#cardGrad)"/>
      <!-- thumbnail inside first card -->
      <rect x="12" y="12" width="196" height="64" rx="6" ry="6" fill="rgba(11,18,32,0.9)"/>
      <g transform="translate(24,20)">
        <rect x="0" y="0" width="72" height="40" rx="6" ry="6" fill="#111827"/>
        <rect x="84" y="0" width="92" height="12" rx="4" ry="4" fill="#ffffff" opacity="0.9"/>
        <rect x="84" y="18" width="92" height="10" rx="4" ry="4" fill="#ffffff" opacity="0.65"/>
        <!-- play icon -->
        <polygon points="18,8 18,32 36,20" fill="#7c3aed" transform="translate(4,0)"/>
      </g>

      <rect x="0" y="132" width="220" height="120" rx="10" ry="10" fill="#fff" opacity="0.96"/>
      <!-- thumbnail inside second card -->
      <rect x="12" y="144" width="196" height="64" rx="6" ry="6" fill="#0b1220"/>
      <g transform="translate(24,152)">
        <rect x="0" y="0" width="72" height="40" rx="6" ry="6" fill="#0b1220"/>
        <rect x="84" y="0" width="92" height="12" rx="4" ry="4" fill="#0b1220" opacity="0.95"/>
        <rect x="84" y="18" width="92" height="10" rx="4" ry="4" fill="#0b1220" opacity="0.8"/>
        <polygon points="18,8 18,32 36,20" fill="#5b21b6" transform="translate(4,0)"/>
      </g>
    </g>

    <!-- center featured card -->
    <g transform="translate(264,24)">
      <rect x="0" y="0" width="260" height="170" rx="12" ry="12" fill="#7c3aed"/>
      <rect x="16" y="18" width="160" height="18" rx="6" ry="6" fill="#ffffff" opacity="0.9"/>
      <rect x="16" y="44" width="220" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.7"/>
      <rect x="16" y="64" width="120" height="12" rx="6" ry="6" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- right column small cards -->
    <g transform="translate(264,204)">
      <rect x="0" y="0" width="120" height="78" rx="8" ry="8" fill="#fff"/>
      <rect x="140" y="0" width="120" height="78" rx="8" ry="8" fill="#fff"/>
    </g>

    <!-- keyboard area (subtle) -->
    <rect x="28" y="260" width="504" height="28" rx="6" ry="6" fill="#0b1220" opacity="0.6"/>
  </g>

  <!-- subtle reflection overlay -->
  <path d="M60 40 C140 10, 580 10, 660 40 L660 420 C580 450, 140 450, 60 420 Z" fill="rgba(255,255,255,0.02)"/>

</svg>
