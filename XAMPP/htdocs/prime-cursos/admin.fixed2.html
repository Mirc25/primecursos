<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prime Cursos — Admin (fixed2)</title>
  <style>
    :root{--bg:#0f1720;--panel:#071224;--muted:#89a0b3;--accent:#0b79d0}
    body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:var(--bg);color:#e6eef8}
    .wrap{max-width:960px;margin:18px auto;padding:18px}
    .card{background:rgba(255,255,255,0.02);padding:12px;border-radius:8px;margin-bottom:12px}
    textarea,input,button{font:inherit}
    textarea,input{width:100%;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;border:0;background:var(--accent);color:#fff}
    .muted{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div style="display:flex;align-items:center;gap:12px;">
      <h1 style="margin:0">Prime <strong>Cursos</strong> — Admin (fixed2)</h1>
      <button id="myCoursesBtn" class="btn" style="margin-left:8px;background:#6b6fef">Mis cursos</button>
    </div>

    <section class="card">
      <h3>Importar curso (texto plano)</h3>
      <p class="muted">Pega el texto plano. Marca la opción correcta con <code>*</code>.</p>
      <textarea id="raw" rows="8" placeholder="Pega el texto del curso aquí"></textarea>
      <p class="muted" style="margin-top:8px">O pega aquí un objeto JSON del curso (estructura completa).</p>
      <textarea id="rawJson" rows="8" placeholder='Pega aquí JSON del curso (ej: {"title":"...","modules":[...]})'></textarea>
      <div style="margin-top:8px">
        <button id="preview" class="btn">Previsualizar</button>
        <button id="import" class="btn" style="background:#0ca87b;margin-left:8px">Importar</button>
        <button id="importJson" class="btn" style="background:#0b6fa0;margin-left:8px">Importar JSON</button>
      </div>
      <div id="previewArea" style="display:none;margin-top:12px"></div>
    </section>

    <section class="card">
      <h3>Cursos (localStorage)</h3>
      <div style="margin-bottom:8px">
        <button id="cleanupBtn" class="btn" style="background:#d08b2b">Limpiar duplicados y reparar</button>
      </div>
      <div id="list"></div>
    </section>
  </div>

  <script>
  (function(){
    var storageKey = 'prime_courses';
    var courses = [];
    var selectedCourseId = null; // id of course selected in list for the single "Ver alumno" button

    // Add a small CSS rule to isolate preview images from site-wide rules
    try{
      var pcCss = document.createElement('style');
        pcCss.textContent = '.pc-preview-img{object-fit:contain!important;display:block!important;max-width:180px!important;max-height:140px!important;width:auto!important;height:auto!important;border-radius:6px!important;background:transparent!important;}';
      document.head.appendChild(pcCss);
    }catch(e){}

    function uid(){ return Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,9); }

    function load(){
      try{
        var s = localStorage.getItem(storageKey);
        courses = s ? JSON.parse(s) : [];
      }catch(e){ courses = []; }
      // dedupe courses by id or by title+price to avoid accidental duplicates
      var seen = {};
      var deduped = [];
      courses.forEach(function(c){
        var key = c.id ? String(c.id) : (String(c.title||'')+'|'+String(c.price||0));
        if(!seen[key]){ seen[key]=true; deduped.push(c); }
      });
      courses = deduped;
      // persist deduped list to avoid repeated duplicates in storage
      try{ localStorage.setItem(storageKey, JSON.stringify(courses)); }catch(e){}
      renderList();
    }

    function save(){ try{ localStorage.setItem(storageKey, JSON.stringify(courses)); }catch(e){} }

    // Broadcast update to other tabs/windows so the storefront reloads immediately
    function broadcastUpdate(){
      try{
        if(typeof BroadcastChannel !== 'undefined'){
          var bc = new BroadcastChannel('prime_courses_channel');
          try{ bc.postMessage({ type: 'updated', ts: Date.now() }); }catch(e){}
          try{ bc.close(); }catch(e){}
        } else {
          // Fallback: write a small timestamp flag to localStorage to trigger storage events
          try{ localStorage.setItem('__prime_courses_update_ts', String(Date.now())); }catch(e){}
        }
      }catch(e){}
    }

    function parseCoursePlain(text){
      var lines = String(text||'').split(/\r?\n/).map(l=>l.trim());
      var course = { id: uid(), title:'', category:'', short_description:'', description:'', price:0, image:null, modules:[], evaluation:[] };
      var curMod = null, curSub = null, mode = '';
      for(var i=0;i<lines.length;i++){
        var L = lines[i];
        if(!L) continue;
        // detect inline question with options in the same line, e.g.
        // "¿Cuál...? A) opt1 B) opt2 C) opt3 * D) opt4"
        if(/A\)/i.test(L) && /B\)/i.test(L)){
          try{
            var aIdx = L.search(/A\)/i);
            var qtxt = (aIdx>=0) ? L.slice(0,aIdx).trim() : '';
            var rest = (aIdx>=0) ? L.slice(aIdx) : L;
            var opts = [];
            var ans = null;
            var re = /([A-D])\)\s*([^A-D]*)/ig;
            var m;
            while((m = re.exec(rest)) !== null){
              var key = (m[1]||'').toUpperCase();
              var txt = (m[2]||'').trim();
              if(/\*/.test(txt)){ txt = txt.replace(/\*/g,'').trim(); ans = key; }
              opts.push({ key: key, text: txt });
            }
            if(qtxt){ var target = curMod || course; target.evaluation = target.evaluation || []; target.evaluation.push({ question: qtxt, options: opts, answer: ans }); continue; }
          }catch(e){}
        }
        if(/^TITULO:\s*/i.test(L)){ course.title = L.replace(/^TITULO:\s*/i,'').trim(); continue; }
        if(/^CATEGORIA:\s*/i.test(L)){ course.category = L.replace(/^CATEGORIA:\s*/i,'').trim(); continue; }
        if(/^DESCRIPCION_CORTA:\s*/i.test(L)){ course.short_description = L.replace(/^DESCRIPCION_CORTA:\s*/i,'').trim(); continue; }
        if(/^DESCRIPCION:\s*/i.test(L)){ course.description += (course.description ? '\n' : '') + L.replace(/^DESCRIPCION:\s*/i,'').trim(); mode = 'description'; continue; }
        if(/^PRECIO:\s*/i.test(L)){ course.price = parseFloat(L.replace(/^PRECIO:\s*/i,'').replace(',','.'))||0; continue; }
        var m = L.match(/^MODULO:\s*(?:[0-9\.]+)?\s*-?\s*(.*)$/i);
        if(m){ curMod = { title:(m[1]||'Módulo'), submodules:[], evaluation:[] }; course.modules.push(curMod); curSub = null; mode = 'modules'; continue; }
        var s = L.match(/^SUBMODULO:\s*(?:[0-9\.]+)?\s*-?\s*(.*)$/i);
        if(s){ curSub = { title:(s[1]||'Sub'), content:'', image:null }; if(!curMod){ curMod = { title:'Módulo 1', submodules:[], evaluation:[] }; course.modules.push(curMod); } curMod.submodules.push(curSub); mode='sub'; continue; }
        if(/^IMAGEN:\s*/i.test(L)){ var u = L.replace(/^IMAGEN:\s*/i,'').trim(); if(curSub) { curSub.image = u; } else { course.image = u; } continue; }
        if(/^CONTENIDO:\s*/i.test(L)){ var v = L.replace(/^CONTENIDO:\s*/i,'').trim(); if(curSub) curSub.content += (curSub.content ? '\n' : '') + v; else course.description += (course.description ? '\n' : '') + v; continue; }
        if(/^\+EVALUACION\+/i.test(L) || /^EVALUACION/i.test(L)){ mode='eval'; continue; }
        if(mode==='eval' && /^P:\s*/i.test(L)){
          var q = L.replace(/^P:\s*/i,'').trim(); var opts = [], ans = null; var j = i+1;
          for(; j<lines.length; j++){
            var nx = lines[j]; if(!nx) break;
            var mo = nx.match(/^([A-D])[\)\:]\s*(.*)$/i); if(!mo) break;
            var key = mo[1], txt = mo[2]||'';
            if(/\*/.test(txt)){ txt = txt.replace(/\*/g,'').trim(); ans = key; }
            opts.push({ key:key, text: txt });
          }
          // If inside a module, attach evaluation to the current module, otherwise to course.evaluation
          var target = curMod || course;
          target.evaluation = target.evaluation || [];
          target.evaluation.push({ question: q, options: opts, answer: ans });
          i = j-1; continue;
        }
        if(mode==='description') course.description += (course.description ? '\n' : '') + L;
        else if(mode==='sub' && curSub) curSub.content += (curSub.content ? '\n' : '') + L;
      }
      if(!course.short_description && course.description) course.short_description = course.description.split('\n').join(' ').slice(0,160);
      return course;
    }

    function escapeHtml(s){
      return String(s||'').replace(/[&<>\"]/g, function(m){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[m];
      });
    }

    function renderList(){
      var el = document.getElementById('list'); if(!el) return;
      el.innerHTML = '';
      if(!courses.length){ var msg = document.createElement('div'); msg.className='muted'; msg.textContent='No hay cursos importados'; el.appendChild(msg); return; }

      // helper to read persisted progress for a course
      function getProgressPct(courseId){ try{ var obj = JSON.parse(localStorage.getItem('prime_courses_progress')||'{}'); var s = obj[String(courseId)] || { passed: [] }; var passed = s.passed || []; var count = passed.filter(Boolean).length; var total = 0; var c = courses.find(function(x){ return String(x.id) === String(courseId); }); if(c && Array.isArray(c.modules)) total = c.modules.length; return total? Math.round((count/total)*100):0; }catch(e){ return 0; } }

      // toolbar with single 'Ver alumno' button
      var toolbar = document.createElement('div'); toolbar.style.display='flex'; toolbar.style.alignItems='center'; toolbar.style.gap='8px'; toolbar.style.marginBottom='8px';
      var gv = document.createElement('button'); gv.className='btn'; gv.textContent = 'Ver alumno';
      gv.addEventListener('click', function(){
        if(!courses.length) return alert('No hay cursos para ver');
        var id = selectedCourseId || (courses[0] && courses[0].id);
        var found = courses.find(function(x){ return String(x.id) === String(id); });
        if(!found) return alert('Selecciona un curso de la lista primero');
        openStudentView(found);
      });
      toolbar.appendChild(gv);
      var info = document.createElement('span'); info.className='muted'; info.textContent='Selecciona un curso y pulsa "Ver alumno" para ver su progreso'; toolbar.appendChild(info);
      el.appendChild(toolbar);

      // ensure there is a selectedCourseId
      if(!selectedCourseId && courses.length) selectedCourseId = courses[0].id;

      courses.forEach(function(c){
        var row = document.createElement('div');
        row.style.padding = '8px'; row.style.borderBottom = '1px solid rgba(255,255,255,0.02)'; row.style.display='flex'; row.style.flexDirection='column'; row.style.gap='6px';
        var top = document.createElement('div'); top.style.display='flex'; top.style.alignItems='center'; top.style.gap='12px';
          // cover thumbnail (if present)
          if(c.image){ var thumb = document.createElement('img'); thumb.src = c.image; thumb.style.width='72px'; thumb.style.height='48px'; thumb.style.objectFit='cover'; thumb.style.borderRadius='6px'; thumb.style.marginRight='8px'; top.appendChild(thumb); }
          var radio = document.createElement('input'); radio.type='radio'; radio.name='courseSelect'; radio.value = c.id; radio.id = 'course_' + String(c.id);
          radio.checked = String(selectedCourseId) === String(c.id);
          radio.addEventListener('change', function(){ selectedCourseId = c.id; renderList(); });
          var strong = document.createElement('strong'); strong.textContent = (c.title && String(c.title).length>0) ? (String(c.title).length>80 ? String(c.title).slice(0,80)+'…' : c.title) : (c.short_description ? (c.short_description.length>80?c.short_description.slice(0,80)+'…':c.short_description) : '(sin título)');
          var lab = document.createElement('label'); lab.htmlFor = radio.id; lab.style.cursor = 'pointer'; lab.appendChild(strong);
          top.appendChild(radio);
          top.appendChild(lab);
        // Edit button to load this course into the preview for editing
        var editBtn = document.createElement('button'); editBtn.className='btn'; editBtn.textContent = 'Editar'; editBtn.style.marginLeft = 'auto'; editBtn.style.background = '#0ca87b';
        editBtn.addEventListener('click', function(evt){ evt.stopPropagation(); selectedCourseId = c.id; renderPreview(JSON.parse(JSON.stringify(c))); });
        top.appendChild(editBtn);
        // Delete button
        var delBtn = document.createElement('button'); delBtn.className = 'btn'; delBtn.textContent = 'Eliminar'; delBtn.style.marginLeft = '8px'; delBtn.style.background = '#b03b3b';
        delBtn.addEventListener('click', function(evt){
          try{ evt.stopPropagation(); }catch(e){}
          if(!confirm('Eliminar curso "'+(c.title||'')+'"? Esta acción borrará el curso localmente y en el servidor.')) return;
          // Remove locally
          try{ courses = courses.filter(function(x){ return String(x.id) !== String(c.id); }); localStorage.setItem(storageKey, JSON.stringify(courses)); }catch(e){ console.warn('Error removing course locally', e); }
          try{ broadcastUpdate(); }catch(e){}
          renderList();
          // Attempt server-side deletion (best-effort)
          try{
            fetch('/prime-cursos/delete_course.php', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id: c.id })
            }).then(function(res){ return res.json().catch(function(){ return null; }); }).then(function(json){ if(!json || !json.success) console.warn('delete_course.php failed', json); }).catch(function(err){ console.warn('delete_course error', err); });
          }catch(e){ console.warn('delete_course fetch error', e); }
        });
        top.appendChild(delBtn);
        top.appendChild(lab);
        // progress percent for this course (reads localStorage)
        var pct = getProgressPct(c.id);
        if(typeof pct === 'number'){
          var progLine = document.createElement('div'); progLine.className='muted'; progLine.textContent = 'Progreso: '+pct+'%'; progLine.style.marginLeft='8px'; top.appendChild(progLine);
        }
        row.appendChild(top);
        var catLine = document.createElement('div'); catLine.className='muted'; catLine.textContent = c.category || '';
        row.appendChild(catLine);
        if(String(selectedCourseId) === String(c.id)) row.style.background = 'rgba(255,255,255,0.015)';
        el.appendChild(row);
      });
    }

    var previewBtn = document.getElementById('preview');
    if(previewBtn) previewBtn.addEventListener('click', function(){ var raw = (document.getElementById('raw')||{value:''}).value||''; if(!raw.trim()){ alert('Pega texto'); return; } var parsed = parseCoursePlain(raw); renderPreview(parsed); });

    // 'Mis cursos' quick button: load stored courses and scroll to list
    var myCoursesBtn = document.getElementById('myCoursesBtn');
    if(myCoursesBtn){ myCoursesBtn.addEventListener('click', function(){ try{ load(); var l = document.getElementById('list'); if(l && l.scrollIntoView) l.scrollIntoView({behavior:'smooth'}); }catch(e){ console.error('myCourses load error', e); } }); }

    var importBtn = document.getElementById('import');
    if(importBtn) importBtn.addEventListener('click', function(){
      var toImport = null;
      if(_lastPreview) toImport = JSON.parse(JSON.stringify(_lastPreview));
      else toImport = parseCoursePlain((document.getElementById('raw')||{value:''}).value||'');
      if(!toImport || !toImport.title){ alert('No hay curso válido para importar'); return; }
      // ensure short_description when importing from preview or parsed text
      try{
        if(!toImport.short_description || !String(toImport.short_description).trim()){
          var sd2 = String(toImport.description || '').split(/\r?\n/).join(' ').trim(); if(sd2) sd2 = sd2.slice(0,160); toImport.short_description = sd2 || '';
        }
      }catch(e){}
      // ensure id
      if(!toImport.id) toImport.id = uid();
      // push and select
      courses.push(toImport); save(); selectedCourseId = toImport.id; renderList(); (document.getElementById('raw')||{value:''}).value=''; _lastPreview = null; alert('Curso importado');
    });

    var importJsonBtn = document.getElementById('importJson');
    if(importJsonBtn) importJsonBtn.addEventListener('click', function(){
      var raw = (document.getElementById('rawJson')||{value:''}).value||'';
      if(!raw.trim()){ alert('Pega el JSON del curso en el campo "Importar JSON"'); return; }
      try{
        var obj = JSON.parse(raw);
      }catch(e){ alert('JSON inválido: '+e.message); return; }
      // If the parsed object has a title that actually contains raw labeled text (blob), try to reparsed
      if(obj && obj.title && /\bCATEGORIA:|\bDESCRIPCION:|\bPRECIO:/i.test(String(obj.title))){
        try{
          var reparsed = parseCoursePlain(String(obj.title));
          // merge reparsed fields into obj if they look empty
          obj.title = obj.title && obj.title.trim() && obj.title.length>1 && !/^\{/.test(obj.title) ? reparsed.title || obj.title : reparsed.title || obj.title;
          obj.category = obj.category || reparsed.category;
          obj.short_description = obj.short_description || reparsed.short_description;
          obj.description = obj.description || reparsed.description;
          obj.price = obj.price || reparsed.price;
          if((!obj.modules || !obj.modules.length) && reparsed.modules && reparsed.modules.length) obj.modules = reparsed.modules;
          if((!obj.evaluation || !obj.evaluation.length) && reparsed.evaluation && reparsed.evaluation.length) obj.evaluation = reparsed.evaluation;
        }catch(e){}
      }
      var ok = importCourseObject(obj);
      if(ok) { (document.getElementById('rawJson')||{value:''}).value=''; }
    });

    // Cleanup button: backup localStorage and repair malformed entries (title contains labeled blob)
    var cleanupBtn = document.getElementById('cleanupBtn');
    if(cleanupBtn) cleanupBtn.addEventListener('click', function(){
      try{ cleanupBtn.disabled = true; cleanupBtn.textContent = 'Procesando...'; }
      catch(e){}
      try{
        var before = (localStorage.getItem(storageKey)||'[]');
        // create backup download
        var blobStr = before;
        var a = document.createElement('a'); a.href = 'data:application/json;charset=utf-8,' + encodeURIComponent(blobStr); a.download = 'prime_courses-backup.json'; document.body.appendChild(a); a.click(); a.remove();
      }catch(e){ console.error('backup failed', e); }

      // perform repair and dedupe
      var repaired = 0, total = 0;
      try{
        var arr = courses.slice();
        arr = arr.map(function(c){ total++; var copy = JSON.parse(JSON.stringify(c||{}));
          if(copy.title && /\bCATEGORIA:|\bDESCRIPCION:|\bPRECIO:/i.test(String(copy.title))){
            try{ var p = parseCoursePlain(String(copy.title));
              copy.title = p.title || copy.title; copy.category = copy.category || p.category; copy.short_description = copy.short_description || p.short_description; copy.description = copy.description || p.description; copy.price = copy.price || p.price; if((!copy.modules||!copy.modules.length)&&p.modules&&p.modules.length) copy.modules = p.modules; if((!copy.evaluation||!copy.evaluation.length)&&p.evaluation&&p.evaluation.length) copy.evaluation = p.evaluation; repaired++; }
            catch(e){ }
          }
          return copy;
        });
        // dedupe
        var map = {}, out = [];
        arr.forEach(function(c){ var k = c.id ? String(c.id) : (String(c.title||'')+'|'+String(c.price||0)); if(!map[k]){ map[k]=true; out.push(c); } });
        courses = out;
        try{ localStorage.setItem(storageKey, JSON.stringify(courses)); }catch(e){}
      }catch(e){ console.error('cleanup error', e); }

      renderList();
      try{ cleanupBtn.textContent = 'Limpiar duplicados y reparar'; cleanupBtn.disabled = false; }
      catch(e){}
      alert('Limpieza completada. Entradas totales: '+total+' — reparadas: '+repaired);
    });

    var _lastPreview = null;
    function renderPreview(parsed){
      _lastPreview = JSON.parse(JSON.stringify(parsed || {}));
      var area = document.getElementById('previewArea'); if(!area) return;
      area.style.display = 'block'; area.innerHTML = '';

      var header = document.createElement('div'); header.style.display='flex'; header.style.alignItems='center'; header.style.gap='12px';
      var titleEl = document.createElement('div'); titleEl.contentEditable = true; titleEl.style.fontWeight='700'; titleEl.style.fontSize='18px'; titleEl.textContent = _lastPreview.title || '(sin título)';
      // allow pasting an image into the title to set the course cover (prevent inserting HTML into title)
      titleEl.addEventListener('paste', function(e){
        try{
          var cb = e.clipboardData || window.clipboardData;
          if(!cb) return;
          // image files from clipboard
          if(cb.items && cb.items.length){
            for(var i=0;i<cb.items.length;i++){
              var it = cb.items[i];
              if(it && it.kind === 'file' && it.type && it.type.indexOf('image/') === 0){
                e.preventDefault();
                var f = it.getAsFile();
                var fr = new FileReader();
                fr.onload = function(ev){
                  var data = ev.target.result;
                  coverImg.src = data; coverImg.style.display = 'block'; coverUrl.value = '';
                  try{ _lastPreview.image = data; }catch(err){}
                };
                fr.readAsDataURL(f);
                return;
              }
            }
          }
          // HTML with <img>
          var html = cb.getData && cb.getData('text/html');
          if(html){
            var m = html.match(/<img\s+[^>]*src=["']([^"']+)["']/i);
            if(m && m[1]){ e.preventDefault(); var src = m[1]; coverImg.src = src; coverImg.style.display = 'block'; coverUrl.value = src; try{ _lastPreview.image = src; }catch(err){}; return; }
          }
          // plain data URL or image URL text
          var txt = cb.getData && (cb.getData('text/plain')||cb.getData('text'));
          if(txt){ txt = txt.trim(); if(/^data:image\//i.test(txt)){ e.preventDefault(); coverImg.src = txt; coverImg.style.display = 'block'; coverUrl.value = ''; try{ _lastPreview.image = txt; }catch(err){} } else if(/^(https?:)?\/\//i.test(txt)){ e.preventDefault(); coverImg.src = txt; coverImg.style.display = 'block'; coverUrl.value = txt; try{ _lastPreview.image = txt; }catch(err){} } }
        }catch(err){ console.error('title paste error', err); }
      });
      var catEl = document.createElement('div'); catEl.contentEditable = true; catEl.className='muted'; catEl.textContent = _lastPreview.category || '';
      header.appendChild(titleEl); header.appendChild(catEl);
      area.appendChild(header);

      // Precio y descuento
      var priceRow = document.createElement('div'); priceRow.style.marginTop = '8px'; priceRow.style.display = 'flex'; priceRow.style.alignItems = 'center'; priceRow.style.gap = '8px';
      var priceLabel = document.createElement('div'); priceLabel.className = 'muted'; priceLabel.style.minWidth = '90px'; priceLabel.textContent = 'Precio (USD):'; priceRow.appendChild(priceLabel);
      var priceInput = document.createElement('input'); priceInput.type = 'number'; priceInput.step = '0.01'; priceInput.min = '0'; priceInput.style.width = '140px'; priceInput.value = (_lastPreview && _lastPreview.price!==undefined) ? _lastPreview.price : '';
      priceRow.appendChild(priceInput);

      var discountLabel = document.createElement('div'); discountLabel.className = 'muted'; discountLabel.textContent = 'Descuento (%):'; priceRow.appendChild(discountLabel);
      var discountInput = document.createElement('input'); discountInput.type = 'number'; discountInput.step = '1'; discountInput.min = '0'; discountInput.max = '100'; discountInput.style.width = '80px'; discountInput.value = (_lastPreview && _lastPreview.discount_pct!==undefined) ? _lastPreview.discount_pct : '';
      priceRow.appendChild(discountInput);

      var discountedPreview = document.createElement('div'); discountedPreview.className = 'muted'; discountedPreview.style.marginLeft = 'auto'; discountedPreview.textContent = 'Precio final: -'; priceRow.appendChild(discountedPreview);

      function updateDiscountPreview(){
        var p = parseFloat(priceInput.value);
        if(isNaN(p)) p = 0;
        var d = parseFloat(discountInput.value);
        if(isNaN(d) || d < 0) d = 0;
        if(d > 100) d = 100;
        var final = p * (1 - (d/100));
        discountedPreview.textContent = 'Precio final: $' + final.toFixed(2);
        try{ _lastPreview.price = p; _lastPreview.discount_pct = d; }catch(e){}
      }
      priceInput.addEventListener('input', updateDiscountPreview);
      discountInput.addEventListener('input', updateDiscountPreview);

      renderModuleList(); openModule(startIdx); updateProgressUI();

      // Certificate generation and printable view removed in this build

      load();
      if(/debug=1/.test(location.search)) { window._pc = { parseCoursePlain: parseCoursePlain }; }
      } // end openStudentView
    // Certificate validation handler (admin UI)
    var btn = document.getElementById('validateCert');
    var input = document.getElementById('certToken');
    if(btn && input){
      btn.addEventListener('click', function(){
        var token = (input.value||'').trim();
        if(!token) return alert('Pega el token del certificado en el campo');
        try{
          var store = JSON.parse(localStorage.getItem('prime_certificates')||'{}');
          var cert = store[token];
          if(!cert){ alert('Certificado NO encontrado'); return; }
          var w = window.open('','_blank','width=900,height=700'); if(!w) return alert('Popup bloqueado');
          // build printable validation page via DOM
          w.document.open();
          w.document.write('<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validación de certificado</title><style>body{font-family:Georgia,serif;background:#f7fbff;padding:30px;color:#062033} .card{max-width:820px;margin:0 auto;background:#fff;padding:30px;border-radius:10px;border:1px solid rgba(11,37,68,0.06)} .qr{width:130px;height:130px;border-radius:6px}</style></head><body></body></html>');
          w.document.close();
          var bd = w.document.body;
          var card = w.document.createElement('div'); card.className = 'card';
          var h2 = w.document.createElement('h2'); h2.textContent = 'Certificado válido'; card.appendChild(h2);
          var p1 = w.document.createElement('p'); p1.innerHTML = '<strong>Alumno:</strong> '+escapeHtml(cert.student); card.appendChild(p1);
          var p2 = w.document.createElement('p'); p2.innerHTML = '<strong>Curso:</strong> '+escapeHtml(cert.title); card.appendChild(p2);
          var p3 = w.document.createElement('p'); p3.innerHTML = '<strong>Emitido:</strong> '+escapeHtml((new Date(cert.issuedAt)).toLocaleString()); card.appendChild(p3);
          var p4 = w.document.createElement('p'); p4.innerHTML = '<strong>Firma:</strong> '+escapeHtml(cert.signedBy); card.appendChild(p4);
          var img = w.document.createElement('img'); img.className='qr'; img.src = 'https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl='+encodeURIComponent(cert.token); card.appendChild(img);
          var printWrap = w.document.createElement('div'); printWrap.style.textAlign='right';
          var a = w.document.createElement('a'); a.href='#'; a.className='print'; a.textContent='Imprimir'; a.style.background='#0b79d0'; a.style.color='#fff'; a.style.padding='8px 12px'; a.style.borderRadius='8px'; a.onclick = function(){ w.print(); return false; };
          printWrap.appendChild(a); card.appendChild(printWrap);
          bd.appendChild(card);
        }catch(e){ alert('Error validando: '+(e && e.message || e)); }
      });
    }

    // Refresh UI when other windows modify courses/progress/certificates in localStorage
    try{
      window.addEventListener('storage', function(e){
        if(!e || !e.key) return;
        if(e.key === storageKey || e.key === 'prime_courses_progress' || e.key === 'prime_certificates'){
          try{ load(); }catch(err){}
        }
      });
    }catch(e){}
  })();
  </script>
  <script>
  (function(){
    // Safe cleanup: remove any <link rel="preload"> with an empty or clearly invalid href
    try{
      document.addEventListener('DOMContentLoaded', function(){
        var removed = 0;
        var nodes = document.querySelectorAll('link[rel="preload"], link[rel~="preload"]');
        nodes.forEach(function(el){
          try{
            var h = el.getAttribute('href');
            var invalid = false;
            if(!h || !h.trim()) invalid = true;
            else if(/undefined|null|^data:,$/i.test(h)) invalid = true;
            else if(/^javascript:/i.test(h)) invalid = true;
            else if(!/^(\/|\.\/|\.\.\/|https?:\/\/|\/\/|data:)/i.test(h)) invalid = true;
            if(invalid){ el.remove(); removed++; }
          }catch(e){ /* ignore per-node errors */ }
        });
        if(removed && window.console && console.info) console.info('admin.fixed2.html: removed invalid preload links:', removed);
      });
    }catch(e){ /* nothing to do */ }
  })();
  </script>
