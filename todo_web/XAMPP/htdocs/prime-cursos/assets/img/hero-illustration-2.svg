<?xml version="1.0" encoding="UTF-8"?>
<!-- Alternate stylized scene: tablet + cards + avatar, soft realistic style -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#eef2ff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="tileGrad" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f3ff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)"/>

  <!-- tablet device -->
  <g transform="translate(120,60)">
    <rect x="0" y="0" rx="12" ry="12" width="480" height="300" fill="#ffffff" filter="url(#drop)"/>
    <rect x="18" y="18" width="444" height="120" rx="8" ry="8" fill="#7c3aed"/>
    <g transform="translate(24,150)">
      <rect x="0" y="0" width="120" height="72" rx="8" ry="8" fill="url(#tileGrad)"/>
      <g transform="translate(8,8)">
        <rect x="0" y="0" width="48" height="32" rx="6" ry="6" fill="#0b1220"/>
        <rect x="60" y="0" width="48" height="10" rx="4" ry="4" fill="#7c3aed"/>
        <rect x="60" y="18" width="48" height="8" rx="4" ry="4" fill="#d1ccff" opacity="0.8"/>
      </g>
      <rect x="140" y="0" width="120" height="72" rx="8" ry="8" fill="url(#tileGrad)"/>
      <g transform="translate(148,8)">
        <rect x="0" y="0" width="48" height="32" rx="6" ry="6" fill="#0b1220"/>
        <rect x="60" y="0" width="48" height="10" rx="4" ry="4" fill="#7c3aed"/>
        <rect x="60" y="18" width="48" height="8" rx="4" ry="4" fill="#d1ccff" opacity="0.8"/>
      </g>
      <rect x="280" y="0" width="120" height="72" rx="8" ry="8" fill="url(#tileGrad)"/>
      <g transform="translate(288,8)">
        <rect x="0" y="0" width="48" height="32" rx="6" ry="6" fill="#0b1220"/>
        <rect x="60" y="0" width="48" height="10" rx="4" ry="4" fill="#7c3aed"/>
        <rect x="60" y="18" width="48" height="8" rx="4" ry="4" fill="#d1ccff" opacity="0.8"/>
      </g>
    </g>
    <circle cx="420" cy="36" r="18" fill="#fff" opacity="0.12"/>
  </g>

  <!-- avatar and small card to the left -->
  <g transform="translate(28,200)">
    <circle cx="40" cy="40" r="36" fill="#7c3aed"/>
    <rect x="88" y="16" width="220" height="48" rx="8" ry="8" fill="#fff"/>
    <rect x="88" y="72" width="140" height="8" rx="4" ry="4" fill="#fff" opacity="0.7"/>
  </g>

</svg>
