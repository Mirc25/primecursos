<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Validar Certificado</title>
  <style>
    body{font-family:Inter,system-ui,Segoe UI,Arial;margin:0;background:#f4f6f8;color:#0b2433}
    .wrap{max-width:820px;margin:24px auto;padding:18px}
    .card{background:#fff;padding:20px;border-radius:8px;border:1px solid rgba(0,0,0,0.06)}
    .qr{width:140px;height:140px;border-radius:6px}
    .muted{color:#6b7280}
    input[type=text]{width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px}
    .btn{display:inline-block;padding:8px 12px;border-radius:8px;background:#0b79d0;color:#fff;border:0;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h2>Validar certificado</h2>
      <p class="muted">Pega el token del certificado (o abre esta página con el parámetro <code>?token=TOKEN</code>).</p>
      <div style="margin-top:12px">
        <input id="tokenInput" type="text" placeholder="Token del certificado">
      </div>
      <div style="margin-top:12px">
        <button id="checkBtn" class="btn">Validar</button>
      </div>
      <div id="result" style="margin-top:16px"></div>
    </div>
  </div>

<script>
(function(){
  var input = document.getElementById('tokenInput');
  var btn = document.getElementById('checkBtn');
  var out = document.getElementById('result');

  function renderCert(cert){
    out.innerHTML = '';
    if(!cert) return;
    var card = document.createElement('div'); card.className='card';
    var h = document.createElement('h3'); h.textContent = 'Certificado válido'; card.appendChild(h);
    var p1 = document.createElement('p'); p1.innerHTML = '<strong>Alumno:</strong> ' + (cert.student||''); card.appendChild(p1);
    var p2 = document.createElement('p'); p2.innerHTML = '<strong>Curso:</strong> ' + (cert.title||''); card.appendChild(p2);
    var p3 = document.createElement('p'); p3.innerHTML = '<strong>Emitido:</strong> ' + (new Date(cert.issuedAt||'').toLocaleString()); card.appendChild(p3);
    var img = document.createElement('img'); img.className='qr';
    // QR points to this same validation URL so scanning opens the validator on any device
    var verifyUrl = location.href.split('?')[0] + '?token=' + encodeURIComponent(cert.token);
    img.src = 'https://chart.googleapis.com/chart?cht=qr&chs=300x300&chl=' + encodeURIComponent(verifyUrl);
    card.appendChild(img);
    var printWrap = document.createElement('div'); printWrap.style.textAlign='right';
    var a = document.createElement('a'); a.href='#'; a.className='btn'; a.textContent = 'Imprimir'; a.onclick = function(){ window.print(); return false; };
    printWrap.appendChild(a); card.appendChild(printWrap);
    out.appendChild(card);
  }

  function showNotFound(){ out.innerHTML = '<div class="card"><h3>No encontrado</h3><p class="muted">El token no corresponde a ningún certificado almacenado localmente en este navegador.</p></div>'; }

  function check(token){ if(!token) return; try{ var store = JSON.parse(localStorage.getItem('prime_certificates')||'{}'); var cert = store[token]; if(!cert){ showNotFound(); } else { renderCert(cert); } }catch(e){ out.textContent = 'Error leyendo almacenamiento: '+(e && e.message || e); } }

  btn.addEventListener('click', function(){ var t = (input.value||'').trim(); if(!t) return alert('Pega el token'); check(t); });

  // If token provided in query string, auto-check
  try{
    var qs = (location.search||'').replace('?','');
    var params = qs.split('&').reduce(function(acc,p){ if(!p) return acc; var kv = p.split('='); acc[decodeURIComponent(kv[0])] = kv[1] ? decodeURIComponent(kv[1]) : ''; return acc; }, {});
    if(params.token){ input.value = params.token; check(params.token); }
  }catch(e){}
})();
</script>
</body>
</html>
